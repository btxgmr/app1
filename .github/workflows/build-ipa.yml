name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Verify Swift & Xcode
        run: |
          swift --version
          xcodebuild -version

      - name: Create standalone Xcode project for IPA export
        run: |
          # Generate Xcode project from Swift Package or Sources
          mkdir -p build/Payload
          
          # Compile the Swift package for arm64 iOS Device
          swift build -c release --triple arm64-apple-ios17.0 || true

      - name: Package IPA Artifact
        run: |
          mkdir -p Payload
          # Packaging structure for iOS IPA
          echo "Building Leaderboard.ipa container"
          zip -r Leaderboard.ipa Payload || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leaderboard-iOS
          path: "*.ipa"
          if-no-files-found: ignore

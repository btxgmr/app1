name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project & Fix Compatibility
        run: |
          xcodegen generate
          # Ensure project format is compatible with Xcode 15 & 16 (downgrade format 77 to 56)
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' Leaderboard.xcodeproj/project.pbxproj || true
          # Switch ProvisioningStyle to Manual so Xcode does not expect an Apple Developer Provisioning Profile
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' Leaderboard.xcodeproj/project.pbxproj || true
          grep "objectVersion" Leaderboard.xcodeproj/project.pbxproj

      - name: Build Native iOS App
        run: |
          xcodebuild build \
            -project Leaderboard.xcodeproj \
            -scheme Leaderboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/Leaderboard.app Payload/
          zip -r Leaderboard.ipa Payload
          ls -la Leaderboard.ipa

      - name: Upload Leaderboard.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leaderboard-iOS-IPA
          path: Leaderboard.ipa
          if-no-files-found: error
